[project]
name = "autonomous-trading-floor"
version = "0.1.0"
description = "A multi-agent AI trading simulation with MCP integrations and a real-time dashboard."
requires-python = ">=3.12"
dependencies = [
    "openai-agents==0.15.1",
    "openai==2.34.0",
    "mcp==1.27.0",
    "massive==2.8.0",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.3",
    "requests==2.33.1",
    "gradio==6.14.0",
    "pandas==3.0.2",
    "plotly==6.8.0",
]

[dependency-groups]
dev = [
    "ipython==9.13.0",
]

[tool.uv]
package = false
